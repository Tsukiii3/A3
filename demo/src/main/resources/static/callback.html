<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Autenticando...</title>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      font-family: 'DM Sans', sans-serif;
    }
    .msg {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      font-size: 15px;
      color: #8a8f98;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #2a2d35;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="msg">
    <div class="spinner"></div>
    <span>Autenticando com Google...</span>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code   = params.get('code');
    const error  = params.get('error');

    if (error || !code) {
      window.location.href = 'login.html?erro=' + (error || 'acesso_negado');
    } else {
      fetch('https://a3-74um.onrender.com/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code })
      })
      .then(res => res.json())
      .then(data => {
        if (data.token) {
          localStorage.setItem('phishguard_token', data.token);
          localStorage.setItem('phishguard_email', data.email);
          localStorage.setItem('phishguard_nome',  data.nome);
          window.location.href = 'index.html';
        } else {
          window.location.href = 'login.html?erro=' + (data.erro || 'erro_auth');
        }
      })
      .catch(() => {
        window.location.href = 'login.html?erro=erro_servidor';
      });
    }
  </script>
</body>
</html>

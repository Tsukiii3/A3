<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhishGuard — Login</title>
<link href="meu.css" rel="stylesheet">
<style>
  .login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: var(--shadow-md);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .login-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .login-logo-icon {
    width: 44px;
    height: 44px;
    background: var(--accent);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }

  .login-logo-name {
    font-size: 26px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.5px;
  }

  .login-logo-name span {
    color: var(--accent);
  }

  .login-subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 36px;
    text-align: center;
  }

  .login-divider {
    width: 100%;
    height: 1px;
    background: var(--border);
    margin: 28px 0;
  }

  .btn-google {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px 20px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text-primary);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background var(--transition), box-shadow var(--transition);
    text-decoration: none;
  }

  .btn-google:hover {
    background: var(--hover-bg);
    box-shadow: var(--shadow-sm);
  }

  .btn-google:active {
    transform: scale(0.99);
  }

  .google-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  .login-footer {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    margin-top: 28px;
    line-height: 1.6;
  }

  .login-footer a {
    color: var(--accent);
    text-decoration: none;
  }

  .login-footer a:hover {
    text-decoration: underline;
  }

  .login-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 12px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 20px;
    margin-bottom: 32px;
  }

  .login-badge svg {
    flex-shrink: 0;
  }

  /* Toast de erro */
  .toast {
    display: none;
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #c5221f;
    color: #fff;
    font-size: 14px;
    padding: 12px 20px;
    border-radius: 8px;
    box-shadow: var(--shadow-md);
    z-index: 9999;
    white-space: nowrap;
  }

  .toast.show { display: block; }

  /* Loading state */
  .btn-google.loading {
    opacity: 0.7;
    pointer-events: none;
  }

  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <div class="login-logo-icon">✉</div>
      <span class="login-logo-name">Phis<span>Guard</span></span>
    </div>

    <p class="login-subtitle">Proteção inteligente contra phishing</p>

    <div class="login-badge">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      Seus emails são analisados com segurança
    </div>

    <button class="btn-google" id="loginBtn" onclick="loginComGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      <span id="btnText">Entrar com Google</span>
    </button>

    <div class="login-footer">
      Ao entrar, você concorda com nossos<br>
      <a href="#">Termos de uso</a> e <a href="#">Política de privacidade</a>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = 'https://a3-74um.onrender.com';

  if (localStorage.getItem('phishguard_token')) {
    window.location.href = 'index.html';
  }

  // Mostra erro vindo do callback
  const erroParam = new URLSearchParams(window.location.search).get('erro');
  if (erroParam) mostrarToast('Erro ao fazer login: ' + erroParam);

  function loginComGoogle() {
    const btn = document.getElementById('loginBtn');
    btn.classList.add('loading');
    btn.innerHTML = `<div class="spinner"></div><span>Conectando...</span>`;

    const clientId    = '14781768095-jppqe6ahirnn55egh3lad3pp0bdjhkl8.apps.googleusercontent.com';
    const redirectUri = encodeURIComponent('https://a3-74um.onrender.com/callback.html');
    const scope = encodeURIComponent(
  'https://www.googleapis.com/auth/gmail.readonly ' +
  'https://www.googleapis.com/auth/gmail.send ' +
  'email profile'
);
    const url = `https://accounts.google.com/o/oauth2/v2/auth`
              + `?client_id=${clientId}`
              + `&redirect_uri=${redirectUri}`
              + `&response_type=code`
              + `&scope=${scope}`
              + `&access_type=offline`
              + `&prompt=consent`;

    // Redireciona a página inteira, sem popup
    window.location.href = url;
  }

  function mostrarToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 4000);
  }
</script>

</body>
</html>
